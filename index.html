<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is deliberately NOT locked (no maximum-scale/user-scalable=no) — an earlier attempt
         to lock it here, plus a hard JS-level pinch block in main.jsx, together made any zoomed
         state unrecoverable: once an athlete ended up zoomed in for any reason (an input-focus
         auto-zoom slipping past the 16px guard in index.css, or anything else), there was no way
         to pinch back out again, which is worse than the accidental-zoom bug it was meant to
         prevent. Double-tap-zoom is still independently guarded via touch-action: manipulation
         (index.css) — this only restores the athlete's manual escape hatch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRK - Fit</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#151515" />
    <meta name="description" content="BRK Fit — workout templates, custom plans, and progression tracking." />
    <!-- BRK brand typography (see src/index.css's own comment for the single place these are
         wired to the font-brk-display/heading/body Tailwind utilities, and to the app's default
         sans font). Anton/Oswald/Inter are all open-source (SIL OFL), served from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-charcoal-deep">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
